name: One-time source transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[source-transfer]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch source repository
        run: git clone --depth 1 https://github.com/redsun352/yuklab.git /tmp/source

      - name: Replace target contents with source
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-source.yml' \
            /tmp/source/ ./
          rm -f .github/workflows/sync-source.yml

      - name: Commit and push transferred source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to transfer."
            exit 0
          fi
          git commit -m "Transfer full source from redsun352/yuklab [source-transfer]"
          git push origin HEAD:main
