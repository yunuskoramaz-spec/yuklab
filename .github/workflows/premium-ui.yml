name: Premium UI checks and APK
on:
  push:
    branches: [design/premium-turquoise]
    paths-ignore: [yuklab.zip, .github/workflows/recover-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build test and lint
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YukLab-2.3-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/previews/
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yuklab/database generate
      - run: pnpm --filter @yuklab/api typecheck
      - name: Isolated API tests
        run: pnpm --filter @yuklab/api exec vitest run src/modules/directory/mobile.unit.test.ts src/server.test.ts
        env:
          NODE_ENV: test
      - run: pnpm --filter @yuklab/web test
      - run: pnpm --filter @yuklab/web build
